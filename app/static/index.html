<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multi-TTS Server</title>
<style>
  :root { --bg:#111318; --panel:#1a1f27; --line:#2a3038; --txt:#e6e9ef; --dim:#9aa3b2; --acc:#4a9eff; --ok:#3fca7f; --warn:#e8b23c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); margin-bottom:18px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .panel h2 { font-size:14px; margin:0 0 12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  label { display:block; margin:8px 0 4px; color:var(--dim); font-size:12px; }
  input[type=text], input[type=number], select, textarea {
    width:100%; background:#0e1116; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:14px; }
  textarea { min-height:80px; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:140px; }
  button { background:var(--acc); color:#fff; border:none; border-radius:6px; padding:9px 16px; font-size:14px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button.sec { background:#2a3038; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status { display:inline-block; margin-left:8px; padding:2px 8px; border-radius:10px; font-size:12px; }
  .status.ok { background:#173c2a; color:var(--ok); }
  .status.no { background:#3c2c17; color:var(--warn); }
  .badge { font-size:12px; color:var(--dim); }
  #progress { font-size:13px; color:var(--dim); margin:8px 0; min-height:18px; white-space:pre-wrap; }
  .metric { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--dim); }
  .metric b { color:var(--txt); font-weight:600; }
  #voices-list { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:#0e1116; border:1px solid var(--line); border-radius:14px; padding:4px 10px; font-size:12px; }
  #drop { border:1px dashed var(--line); border-radius:8px; padding:14px; text-align:center; color:var(--dim); cursor:pointer; }
  #drop.drag { border-color:var(--acc); color:var(--txt); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Multi-TTS Server</h1>
  <div class="sub">
    Движок: <b id="engine">—</b> &nbsp;·&nbsp; Модель: <b id="model">—</b>
    <span class="status" id="healthStatus">checking…</span>
  </div>

  <div class="panel">
    <h2>Синтез</h2>
    <label for="text">Текст</label>
    <textarea id="text">Привет, путник. Добро пожаловать в Скайрим!</textarea>
    <div class="row">
      <div><label for="voice">Голос</label><select id="voice"><option value="">Встроенный</option></select></div>
      <div><label for="language">Язык</label><select id="language"><option>ru</option><option>en</option><option>auto</option></select></div>
    </div>
    <div class="row">
      <div><label for="temp">temperature</label><input type="number" id="temp" value="0.7" step="0.05"></div>
      <div><label for="top_p">top_p</label><input type="number" id="top_p" value="0.8" step="0.05"></div>
      <div><label for="rp">repetition_penalty</label><input type="number" id="rp" value="1.1" step="0.05"></div>
    </div>
    <div style="margin-top:12px;">
      <button id="btnSpeak">Озвучить (стриминг)</button>
      <button id="btnStop" class="sec" disabled>Стоп</button>
    </div>
    <div id="progress"></div>
    <div class="metric">
      <span>Первый чанк: <b id="mFirst">—</b></span>
      <span>Всего: <b id="mTotal">—</b></span>
      <span>Аудио: <b id="mAudio">—</b></span>
      <span>RTF: <b id="mRtf">—</b></span>
    </div>
  </div>

  <div class="panel">
    <h2>Голоса</h2>
    <div id="voices-list"></div>
    <div style="margin-top:10px;">
      <div id="drop">Перетащи сюда reference WAV (клип NPC) или кликни</div>
      <input type="file" id="file" accept=".wav" style="display:none">
      <div class="row" style="margin-top:10px;">
        <div><label for="spkName">Имя голоса</label><input type="text" id="spkName" placeholder="serana"></div>
        <div><label for="spkTranscript">Транскрипт клипа (для Qwen3, опционально)</label><input type="text" id="spkTranscript" placeholder="I am Serana. Follow me."></div>
      </div>
      <button id="btnUpload" class="sec" style="margin-top:10px;">Загрузить голос</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const engineName = document.querySelector('.sub b');
let audioCtx = null, activeSource = null, playing = false;

async function refreshHealth() {
  try {
    const r = await fetch('/health');
    const j = await r.json();
    $('engine').textContent = j.engine;
    $('model').textContent = j.model;
    const st = $('healthStatus');
    st.textContent = j.status;
    st.className = 'status ' + (j.status === 'healthy' ? 'ok' : 'no');
    const sel = $('voice');
    const current = sel.value;
    sel.innerHTML = '<option value="">Встроенный</option>';
    for (const v of (j.voices || [])) {
      const o = document.createElement('option');
      o.value = v; o.textContent = v; sel.appendChild(o);
    }
    if ([...sel.options].some(o => o.value === current)) sel.value = current;
    renderVoices(j.voices || []);
  } catch (e) {
    $('healthStatus').textContent = 'оффлайн';
    $('healthStatus').className = 'status no';
  }
}

function renderVoices(list) {
  $('voices-list').innerHTML = list.length
    ? list.map(v => `<span class="chip">${v}</span>`).join('')
    : '<span class="badge">нет загруженных голосов</span>';
}

function beepBuffer(sr, sec) {
  const n = Math.floor(sr * sec);
  const buf = audioCtx.createBuffer(1, n, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.sin(2 * Math.PI * 440 * i / sr) * 0.08;
  return buf;
}

async function playWavBase64(b64, sr) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const blob = new Blob([bytes], { type: 'audio/wav' });
  const ab = await blob.arrayBuffer();
  const audio = await audioCtx.decodeAudioData(ab);
  const src = audioCtx.createBufferSource();
  src.buffer = audio;
  src.connect(audioCtx.destination);
  if (activeSource) { try { activeSource.stop(); } catch {} }
  activeSource = src;
  src.onended = () => { activeSource = null; };
  src.start();
}

async function speak() {
  if (playing) return;
  const text = $('text').value.trim();
  if (!text) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  playing = true; $('btnSpeak').disabled = true; $('btnStop').disabled = false;
  $('progress').textContent = 'Соединение…';
  const voice = $('voice').value;
  const params = new URLSearchParams({ text, language: $('language').value });
  if (voice) params.set('speaker_wav', voice);
  const started = performance.now();
  let firstChunk = null;
  const t0 = Date.now();
  try {
    const resp = await fetch('/tts_stream?' + params);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch { continue; }
        if (evt.event === 'meta') {
          $('progress').textContent = `Генерация ${evt.sentences} фраз${audioCtx.state === 'suspended' ? '…' : ''}`;
          if (audioCtx.state === 'suspended') await audioCtx.resume();
        } else if (evt.event === 'chunk') {
          if (firstChunk === null) firstChunk = performance.now() - started;
          $('progress').textContent = `Фраза ${evt.index + 1}/${evt.total} (${evt.gen_ms} мс)`;
          await playWavBase64(evt.wav_b64, evt.sr || 24000);
        } else if (evt.event === 'done') {
          $('mFirst').textContent = (evt.first_chunk_ms ?? 0).toFixed(0) + ' мс';
          $('mTotal').textContent = evt.elapsed_ms.toFixed(0) + ' мс';
          $('mAudio').textContent = evt.audio_sec.toFixed(2) + ' с';
          $('mRtf').textContent = (evt.rtf ?? 0).toFixed(2);
          $('progress').textContent = 'Готово.';
        }
      }
    }
  } catch (e) {
    $('progress').textContent = 'Ошибка: ' + e;
  } finally {
    playing = false; $('btnSpeak').disabled = false; $('btnStop').disabled = true;
  }
}

function stopAudio() {
  if (activeSource) { try { activeSource.stop(); } catch {} activeSource = null; }
  $('progress').textContent = 'Остановлено.';
}

$('btnSpeak').onclick = speak;
$('btnStop').onclick = stopAudio;

const drop = $('drop'), fileInput = $('file');
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
drop.ondragleave = () => drop.classList.remove('drag');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('drag');
  if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
};
fileInput.onchange = () => { if (fileInput.files[0]) uploadFile(fileInput.files[0]); };

async function uploadFile(file) {
  let name = $('spkName').value.trim();
  if (!name) name = file.name.replace(/\.wav$/i, '') || 'voice';
  const fd = new FormData();
  fd.append('speaker_name', name);
  fd.append('wav_file', file);
  fd.append('language', 'ru');
  $('progress').textContent = `Загрузка ${name}…`;
  try {
    const r = await fetch('/create_and_store_latents', { method: 'POST', body: fd });
    const j = await r.json();
    $('progress').textContent = j.message || ('Голос загружен: ' + name);
    const tr = $('spkTranscript').value.trim();
    if (tr) {
      await fetch('/save_transcript', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, transcript: tr }) });
    }
    refreshHealth();
  } catch (e) {
    $('progress').textContent = 'Ошибка загрузки: ' + e;
  }
}

refreshHealth();
setInterval(refreshHealth, 30000);
</script>
</body>
</html>
